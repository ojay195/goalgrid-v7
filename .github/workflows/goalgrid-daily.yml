
name: GoalGrid V7 data refresh

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: goalgrid-v7-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out GoalGrid
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build updated V7 predictions
        run: python automation/update_goalgrid.py

      - name: Upload Stage A test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goalgrid-stage-a-test-reports
          path: |           
            automation/data/
            automation/team_matching_audit.csv
            automation/v7_fixture_eligibility_report.csv
            automation/v7_live_predictions.csv
          if-no-files-found: warn
      
          retention-days: 7

